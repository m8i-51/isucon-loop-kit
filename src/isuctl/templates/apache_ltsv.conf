# Apache LTSV for alp. %{us}T is microseconds.
# bootstrap sets access_time_unit = "us" so pull rewrites request_time to seconds.
LogFormat "time:%{%Y-%m-%dT%H:%M:%S%z}t\tremote_addr:%a\trequest_method:%m\turi:%U%q\tstatus:%>s\trequest_time:%{us}T\tupstream_response_time:-" isuctl_ltsv
CustomLog __ACCESS_LOG__ isuctl_ltsv
