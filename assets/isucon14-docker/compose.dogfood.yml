# Overlay for isucon14 development/compose-python.yml
# Usage (from /opt/isucon14/development):
#   export ISUCON_LOOP_KIT_ROOT=/path/to/isucon-loop-kit
#   docker compose -f compose-python.yml -f "$ISUCON_LOOP_KIT_ROOT/assets/isucon14-docker/compose.dogfood.yml" up -d --build

services:
  webapp:
    build:
      context: ../webapp/python
      dockerfile: ../../development/dockerfiles/Dockerfile.python.dogfood
    environment:
      ENV: local-dev
      ISUCON_DB_HOST: db

  nginx:
    volumes:
      - ${ISUCON_LOOP_KIT_ROOT}/assets/isucon14-docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - dogfood_nginx_logs:/var/log/nginx

  db:
    volumes:
      - dogfood_mysql_data:/var/lib/mysql
      - ../webapp/sql:/docker-entrypoint-initdb.d
      - ${ISUCON_LOOP_KIT_ROOT}/assets/isucon14-docker/mysql/slow.cnf:/etc/mysql/conf.d/slow.cnf:ro

  contest-ssh:
    build:
      context: ${ISUCON_LOOP_KIT_ROOT}/assets/isucon14-docker
      dockerfile: Dockerfile.ssh
    ports:
      - "2222:22"
    volumes:
      - ../webapp:/home/isucon/webapp
      - dogfood_nginx_logs:/var/log/nginx
      - dogfood_ssh_keys:/ssh-keys:ro
      - dogfood_mysql_slow_share:/var/log/mysql
    depends_on:
      - nginx
      - db

volumes:
  dogfood_nginx_logs:
    name: dogfood_nginx_logs
  dogfood_ssh_keys:
    name: dogfood_ssh_keys
    external: true
  dogfood_mysql_slow_share:
    name: dogfood_mysql_slow_share
  dogfood_mysql_data:
    name: dogfood_mysql_data
